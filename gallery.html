<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gallery</title>

<meta name="description" content="Photos from the variable-swirl jet flow loop: flow visualization, the swirler rig, and shots from the Douglas Research Lab.">
<link rel="canonical" href="https://rachelawhite.com/gallery.html">

<meta property="og:type" content="article">
<meta property="og:url" content="https://rachelawhite.com/gallery.html">
<meta property="og:title" content="Gallery">
<meta property="og:description" content="Photos from the variable-swirl jet flow loop: flow visualization, the swirler rig, and shots from the Douglas Research Lab.">
<meta property="og:image" content="https://rachelawhite.com/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://rachelawhite.com/assets/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">

<style>
  :root {
    --muted: var(--text-muted);
    --surface: var(--bg-subtle);
    --measure: 1000px;
  }

  body { padding: 0 0 40px; }

  .container {
    max-width: var(--measure);
    margin: 0 auto;
    padding: 40px clamp(16px, 5vw, 40px) 0;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }

  .page-desc {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 32px;
  }

  /* ── Grid ── */
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 40px;
  }

  .gallery-item {
    all: unset;
    display: block;
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: zoom-in;
    aspect-ratio: 4 / 3;
  }

  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }

  .gallery-item:hover img,
  .gallery-item:focus-visible img { transform: scale(1.05); }

  .gallery-item:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ── Lightbox ── */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgb(0 0 0 / 0.86);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .lightbox.open { opacity: 1; pointer-events: auto; }

  .lightbox img {
    max-width: 100%;
    max-height: 82vh;
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
  }

  .lightbox-close {
    position: absolute;
    top: 20px;
    right: 24px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgb(255 255 255 / 0.12);
    color: #fff;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }

  .lightbox-close:hover { background: rgb(255 255 255 / 0.22); }

  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgb(255 255 255 / 0.12);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }

  .lightbox-nav:hover { background: rgb(255 255 255 / 0.22); }
  .lightbox-prev { left: 16px; }
  .lightbox-next { right: 16px; }

  @media (max-width: 560px) {
    .lightbox-nav { width: 36px; height: 36px; font-size: 16px; }
  }
</style>
</head>
<body>

<header class="site-nav">
  <div class="site-nav-inner">
    <a class="site-nav-brand" href="index.html">
      Rachel White
    </a>
  </div>
</header>

<nav class="project-nav" aria-label="Variable-swirl jet flow loop">
  <span class="project-nav-label">Flow Loop</span>
  <a href="calcs.html">Calculator</a>
  <a href="swirler.html">3D Model</a>
  <a href="final-presentation.pdf" target="_blank" rel="noopener" class="ext">Slides</a>
  <a href="gallery.html" aria-current="page">Gallery</a>
</nav>

<div class="container">
  <h1>Gallery</h1>
  <p class="page-desc">Photos from the rig and flow visualization runs in the Douglas Research Lab.</p>

  <div class="gallery-grid" id="galleryGrid">
    <button class="gallery-item">
      <img src="gallery/jet-image-1.jpg" alt="Dyed jet flow showing vortex ring formation and breakdown" loading="lazy">
    </button>
    <button class="gallery-item">
      <img src="gallery/jet-image-2.jpg" alt="Grayscale visualization of vortex rings merging downstream of the nozzle" loading="lazy">
    </button>
    <button class="gallery-item">
      <img src="gallery/artistic-image-1.jpg" alt="A single water drop breaking the surface of still water" loading="lazy">
    </button>
    <button class="gallery-item">
      <img src="gallery/artistic-image-2.jpg" alt="Abstract close-up of light through droplets on the nozzle housing" loading="lazy">
    </button>
  </div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous photo">&#8249;</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next photo">&#8250;</button>
</div>

<footer class="site-footer">
  <span>&copy; <span class="year"></span> Rachel White</span>
  <a href="index.html">rachelawhite.com</a>
</footer>

<script>
  document.querySelectorAll('.year').forEach(e => e.textContent = new Date().getFullYear());

  const items = [...document.querySelectorAll('.gallery-item')];
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  let current = 0;

  function show(index) {
    current = (index + items.length) % items.length;
    const img = items[current].querySelector('img');
    lightboxImg.src = img.src;
    lightboxImg.alt = img.alt;
  }

  function open(index) {
    show(index);
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function close() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  items.forEach((item, i) => item.addEventListener('click', () => open(i)));
  document.getElementById('lightboxClose').addEventListener('click', close);
  document.getElementById('lightboxPrev').addEventListener('click', () => show(current - 1));
  document.getElementById('lightboxNext').addEventListener('click', () => show(current + 1));

  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) close(); });

  window.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') show(current - 1);
    if (e.key === 'ArrowRight') show(current + 1);
  });
</script>
</body>
</html>
