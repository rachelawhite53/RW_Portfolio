  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    /* Palette lives in assets/site.css; local aliases keep the rules
       below working under their original names. */
    :root {
      --muted: var(--text-muted);
      --surface: var(--bg-subtle);
      --measure: 1400px;
      /* Pale CAD geometry needs a dark stage to read at all. */
      --stage: #1b2436;
      --stage-2: #0e1626;
    }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      min-height: 100vh;
    }

    /* body centres its children, so the full-bleed chrome has to opt out */
    .site-nav, .project-nav, .site-footer { width: 100%; align-self: stretch; }
    .project-nav, .site-footer { max-width: var(--measure); margin-inline: auto; }

    /* --- Main Layout --- */
    .wrap {
      width: 100%;
      max-width: var(--measure);
      padding: 20px clamp(16px, 5vw, 40px) 0;
      display: flex;
      gap: 20px;
      align-items: flex-start;
      height: 80vh;
    }

    /* Viewer Container */
    .viewerBox {
      flex: 1;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, var(--stage) 0%, var(--stage-2) 100%);
      border: 1px solid var(--border);
      height: 100%;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
      --poster-color: transparent;
      --progress-bar-color: #60a5fa;
    }

    /* Sidebar Controls */
    .controls {
      width: 280px;
      background: var(--bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      max-height: 100%;
    }

    .controls h3 {
      margin: 0;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
    }

    .control-group {
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .control-group:last-child {
      border-bottom: none;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select,
    input[type=color],
    button {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    select:hover,
    button:hover {
      border-color: var(--border-strong);
    }

    select:focus, button:focus {
      outline: none;
      border-color: var(--text);
    }

    /* Model Selection Buttons */
    .model-btn {
      text-align: left;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .model-btn.active-model {
      border-color: var(--text);
      background: var(--surface-hover);
      font-weight: 600;
    }

    /* Primary Button Style */
    button.primary {
      background: var(--text);
      color: var(--bg);
      border: none;
      font-weight: 600;
    }

    button.primary:hover {
      background: var(--text-muted);
      border-color: transparent;
    }

    /* Profile Box (Dimensions) */
    .profileBox {
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 12px;
    }

    .dim-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-top: 6px;
      font-family: monospace;
      color: var(--muted);
    }

    .status {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin-top: 4px;
      min-height: 18px;
    }

    /* Responsive */
    @media (max-width: 800px) {
      .wrap {
        flex-direction: column;
        align-items: stretch;   /* otherwise children shrink to content width */
        height: auto;
      }

      .viewerBox {
        /* flex:1 sets flex-basis:0 which wins over height in a column
           container, collapsing the viewer to nothing on phones. */
        flex: none;
        width: 100%;
        height: 55vh;
        min-height: 320px;
      }

      .controls {
        width: 100%;
        max-height: none;
      }
    }
  </style>
</head>

<body>

<header class="site-nav">
  <div class="site-nav-inner">

<nav class="project-nav" aria-label="Variable-swirl jet flow loop">
  <span class="project-nav-label">Flow Loop</span>
  <a href="port.html">Report</a>
  <a href="calcs.html">Calculator</a>
  <a href="swirler.html" aria-current="page">3D Model</a>
  <a href="final-presentation.pdf" target="_blank" rel="noopener" class="ext">Slides</a>
  <a href="https://trello.com/invite/b/689249fb730b8574c7702b8f/ATTIca800c2d2808143cd2956d317f3cbfbaB903CCA1/jet-flow-visualization-project" target="_blank" rel="noopener" class="ext">Timeline</a>

  <div class="wrap">
    <div class="viewerBox" id="viewerBox">
      <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

      <model-viewer id="mv" src="./assets/swirler.gltf" alt="3D Model" camera-controls auto-rotate
        rotation-per-second="30deg" shadow-intensity="1.2" shadow-softness="0.4" exposure="1.0"
        camera-orbit="45deg 55deg 105%"></model-viewer>
    </div>

    <div class="controls">

      <div class="control-group">
        <h3>Model Viewer</h3>
        <div class="status" id="status">Loading model…</div>
      </div>

      <div class="control-group">
        <label>Select Component</label>
        <button class="model-btn active-model" onclick="loadModel(this, './assets/swirler.gltf')">
          Swirler Only <span>●</span>
        </button>
        <button class="model-btn" onclick="loadModel(this, './assets/assembly1.gltf')">
          Assembly Config 1 <span>○</span>
        </button>
        <button class="model-btn" onclick="loadModel(this, './assets/assembly2.gltf')">
          Assembly Config 2 <span>○</span>
        </button>
        <button class="model-btn" onclick="loadModel(this, './assets/assembly3.gltf')">
          Assembly Config 3 <span>○</span>
        </button>

        <button id="resetBtn" style="margin-top:12px">Reset Camera View</button>
      </div>

      <div class="control-group">
        <label>Appearance</label>
        <select id="envSel">
          <option value="dark">Dark Studio</option>
          <option value="light">Light Lab</option>
        </select>

        <label style="margin-top:12px;">Color Tint</label>
        <div style="display:flex; gap:8px;">
          <input id="colorPicker" type="color" value="#ff8833" style="height:40px; width:50px; padding:0;" />
          <button id="applyColor" class="primary">Apply Color</button>
        </div>
      </div>

      <div class="control-group">
        <label>Analysis</label>
        <button id="autoRotateBtn">Auto Rotate: ON</button>

        <div class="profileBox">
          <label style="margin:0 0 8px 0;">Bounding Box (Meters)</label>
          <div class="dim-row"><span>Width (X)</span> <span id="dimX">—</span></div>
          <div class="dim-row"><span>Height (Y)</span> <span id="dimY">—</span></div>
          <div class="dim-row"><span>Depth (Z)</span> <span id="dimZ">—</span></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const mv = document.getElementById('mv');
    const resetBtn = document.getElementById('resetBtn');
    const envSel = document.getElementById('envSel');
    const colorPicker = document.getElementById('colorPicker');
    const applyColor = document.getElementById('applyColor');
    const autoRotateBtn = document.getElementById('autoRotateBtn');
    const dimX = document.getElementById('dimX');
    const dimY = document.getElementById('dimY');
    const dimZ = document.getElementById('dimZ');
    const status = document.getElementById('status');
    const viewerBox = document.getElementById('viewerBox');

    let materialsReady = false;
    let currentMaterials = [];

    // 1. Function to Load Models via Buttons
    window.loadModel = function (btn, file) {
      // Update UI classes
      document.querySelectorAll('.model-btn').forEach(b => {
        b.classList.remove('active-model');
        b.querySelector('span').textContent = '○';
      });
      btn.classList.add('active-model');
      btn.querySelector('span').textContent = '●';

      // Load Model
      status.textContent = 'Loading...';
      dimX.textContent = '...';
      dimY.textContent = '...';
      dimZ.textContent = '...';
      mv.src = file;
    };

    // 2. Handle Model Loaded Event (Dimensions & Materials)
    mv.addEventListener('load', () => {
      status.textContent = 'Model Ready';

      // -- Material Setup --
      try {
        const model = mv.model;
        if (model && model.materials) {
          currentMaterials = model.materials;
          materialsReady = true;
        } else {
          materialsReady = false;
        }
      } catch (e) { materialsReady = false; }

      // -- Dimension Calculation --
      try {
        const dim = mv.getDimensions(); // returns object {x, y, z} in meters
        dimX.textContent = dim.x.toFixed(4);
        dimY.textContent = dim.y.toFixed(4);
        dimZ.textContent = dim.z.toFixed(4);
      } catch (e) {
        dimX.textContent = "Err";
      }
    });

    // 3. Environment Toggle
    envSel.addEventListener('change', () => {
      if (envSel.value === 'light') {
        viewerBox.style.background = '#e2e8f0';
      } else {
        viewerBox.style.background = '';  /* fall back to the CSS gradient */
      }
    });

    // 4. Color Application
    applyColor.addEventListener('click', () => {
      if (!materialsReady) { status.textContent = 'Wait for load...'; return; }

      const hex = colorPicker.value.replace('#', '');
      const r = parseInt(hex.substring(0, 2), 16) / 255;
      const g = parseInt(hex.substring(2, 4), 16) / 255;
      const b = parseInt(hex.substring(4, 6), 16) / 255;

      let appliedCount = 0;

      // Apply to all materials found in the glTF
      currentMaterials.forEach(m => {
        if (m.pbrMetallicRoughness) {
          m.pbrMetallicRoughness.setBaseColorFactor([r, g, b, 1]);
          appliedCount++;
        }
      });

      status.textContent = `Colored ${appliedCount} materials`;
    });

    // 5. Rotation Toggle
    let rotating = true;
    autoRotateBtn.addEventListener('click', () => {
      rotating = !rotating;
      if (rotating) {
        mv.setAttribute('auto-rotate', '');
        autoRotateBtn.textContent = 'Auto Rotate: ON';
        autoRotateBtn.style.opacity = "1";
      } else {
        mv.removeAttribute('auto-rotate');
        autoRotateBtn.textContent = 'Auto Rotate: OFF';
        autoRotateBtn.style.opacity = "0.7";
      }
    });

    // 6. Reset View
    resetBtn.addEventListener('click', () => {
      mv.dismissPoster();
      mv.cameraOrbit = '45deg 55deg 105%';
      mv.fieldOfView = 'auto';
    });

  </script>
